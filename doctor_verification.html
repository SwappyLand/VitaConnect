<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaConnect | Doctor Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #0d6efd; --secondary-color: #198754; --light-bg: #f8f9fa; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', sans-serif; }
        .navbar-brand { font-weight: bold; color: var(--primary-color) !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-heartbeat text-danger"></i> VitaConnect
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary ms-2" href="register.html">Sign Up</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-success shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0"><i class="fas fa-user-md"></i> Doctor Verification</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <div id="verificationSection">
                            <p class="text-muted">To join VitaConnect as a doctor, please upload your medical license for AI Verification.</p>
                            
                            <form id="verifyForm">
                                <div class="mb-4 text-center p-5 border rounded bg-light" style="border-style: dashed !important;">
                                    <i class="fas fa-id-card fa-3x text-success mb-3"></i>
                                    <br>
                                    <label for="licenseFile" class="form-label fw-bold">Upload Medical License (PDF/Image)</label>
                                    <input type="file" class="form-control w-75 mx-auto mt-2" id="licenseFile" required>
                                </div>
                                <button type="button" class="btn btn-success w-100 btn-lg" onclick="simulateVerification()">
                                    Verify License
                                </button>
                            </form>
                            
                            <div id="loadingSpinner" class="text-center mt-4 d-none">
                                <div class="spinner-border text-success" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2 text-muted">Scanning document with AI...</p>
                            </div>
                        </div>

                        <div id="registrationSection" class="d-none mt-4">
                            <div class="alert alert-success d-flex align-items-center">
                                <i class="fas fa-check-circle fa-2x me-2"></i>
                                <div>
                                    <strong>Success!</strong> License Verified. You may now complete your profile.
                                </div>
                            </div>
                            
                            <form action="index.html">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Dr. Full Name</label>
                                        <input type="text" class="form-control" placeholder="Dr. John Doe">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Specialty</label>
                                        <select class="form-select">
                                            <option selected>Select Specialty...</option>
                                            <option>Cardiologist</option>
                                            <option>Dermatologist</option>
                                            <option>General Physician</option>
                                            <option>Pediatrician</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Years of Experience</label>
                                        <input type="number" class="form-control" placeholder="e.g. 5">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Clinic/Hospital Name</label>
                                        <input type="text" class="form-control" placeholder="City Hospital">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" placeholder="doctor@vitaconnect.com">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Create Password</label>
                                    <input type="password" class="form-control" placeholder="******">
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100">Complete Registration</button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function simulateVerification() {
            // 1. Check if file is selected
            const fileInput = document.getElementById('licenseFile');
            if(fileInput.files.length === 0) {
                alert("Please upload a license file first.");
                return;
            }

            // 2. Hide form, Show loading spinner
            document.getElementById('verifyForm').classList.add('d-none');
            document.getElementById('loadingSpinner').classList.remove('d-none');

            // 3. Wait 2 seconds, then show success form
            setTimeout(() => {
                document.getElementById('loadingSpinner').classList.add('d-none');
                document.getElementById('registrationSection').classList.remove('d-none');
            }, 2000); // 2000 milliseconds = 2 seconds
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
