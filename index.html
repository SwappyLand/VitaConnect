<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaConnect | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #0d6efd; --secondary-color: #198754; --light-bg: #f8f9fa; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', sans-serif; }
        .navbar-brand { font-weight: bold; color: var(--primary-color) !important; }
        .card:hover { transform: translateY(-5px); transition: transform 0.2s; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-heartbeat text-danger"></i> VitaConnect
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary ms-2" href="register.html">Sign Up</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="min-height: 80vh;">
        
        <div class="p-5 mb-5 bg-primary rounded-3 text-white text-center" style="background: linear-gradient(45deg, #0d6efd, #0dcaf0);">
            <h1 class="display-5 fw-bold">Find the Best Care</h1>
            <p class="fs-4">Search for doctors, specialists, or clinics near you.</p>
            <div class="d-flex justify-content-center mt-4">
                <input class="form-control form-control-lg w-50 me-2" type="text" placeholder="Search 'Cardiologist'...">
                <button class="btn btn-light btn-lg text-primary fw-bold">Search Doctors</button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3><i class="fas fa-shopping-basket text-success"></i> Pharmacy & Nutrition</h3>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" placeholder="Search for medicines, protein, snacks...">
                    <button class="btn btn-success">Find Products</button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-3 col-6 mb-4">
                <div class="card h-100">
                    <img src="https://placehold.co/200x150?text=Vitamin+C" class="card-img-top" alt="Product">
                    <div class="card-body">
                        <h6 class="card-title">Immunity Booster</h6>
                        <p class="card-text fw-bold text-success">₹499</p>
                        <button class="btn btn-sm btn-success w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-6 mb-4">
                <div class="card h-100">
                    <img src="https://placehold.co/200x150?text=Protein" class="card-img-top" alt="Product">
                    <div class="card-body">
                        <h6 class="card-title">Whey Protein</h6>
                        <p class="card-text fw-bold text-success">₹2,499</p>
                        <button class="btn btn-sm btn-success w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

             <div class="col-md-3 col-6 mb-4">
                <div class="card h-100">
                    <img src="https://placehold.co/200x150?text=Oats" class="card-img-top" alt="Product">
                    <div class="card-body">
                        <h6 class="card-title">Instant Oats</h6>
                        <p class="card-text fw-bold text-success">₹199</p>
                        <button class="btn btn-sm btn-success w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

             <div class="col-md-3 col-6 mb-4">
                <div class="card h-100">
                    <img src="https://placehold.co/200x150?text=Masks" class="card-img-top" alt="Product">
                    <div class="card-body">
                        <h6 class="card-title">N95 Masks (Pack of 5)</h6>
                        <p class="card-text fw-bold text-success">₹350</p>
                        <button class="btn btn-sm btn-success w-100">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-white text-center py-3 border-top mt-5">
        <p class="text-muted mb-0">&copy; 2024 VitaConnect. All rights reserved.</p>
    </footer>

</body>
</html>
