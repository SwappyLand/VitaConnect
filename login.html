<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaConnect | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #0d6efd; --secondary-color: #198754; --light-bg: #f8f9fa; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', sans-serif; }
        .navbar-brand { font-weight: bold; color: var(--primary-color) !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-heartbeat text-danger"></i> VitaConnect
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary ms-2" href="register.html">Sign Up</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="min-height: 80vh;">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm border-0">
                    <h3 class="text-center mb-4 text-primary">Welcome Back</h3>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="******">
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="window.location.href='index.html'">Login</button>
                    </form>
                    <div class="text-center mt-3">
                        <p>Don't have an account? <a href="register.html">Register here</a></p>
                        <hr>
                        <a href="doctor_verification.html" class="btn btn-outline-success btn-sm">
                            <i class="fas fa-user-md"></i> Are you a Doctor?
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
